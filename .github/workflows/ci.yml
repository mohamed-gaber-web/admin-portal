name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (every workspace)
        run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (every workspace)
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (all workspaces)
        run: pnpm build

  db-migrations:
    runs-on: ubuntu-latest
    # A PR that adds a migration is exercised against a throwaway database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run migrations up (throwaway DB)
        run: pnpm --filter @growpath/db migrate:up
      - name: Seed demo data (throwaway DB)
        run: pnpm --filter @growpath/db build && pnpm --filter @growpath/db seed
      - name: Roll back migrations (throwaway DB)
        run: pnpm --filter @growpath/db migrate:down

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform fmt
        run: terraform fmt -check -recursive
        working-directory: infra
      - name: Terraform validate
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: infra/environments/${{ matrix.environment }}

  # ---------------------------------------------------------------------------
  # Single required status check. Branch protection requires "ci-success"
  # (see .github/branch-protection.json), so a failure in ANY check below
  # blocks the merge.
  #
  # To add a future guard rail (e.g. US-013 isolation suite, US-031 permission
  # check, US-062 untranslated-string check): add its job above, then add the
  # job name to `needs` here.
  # ---------------------------------------------------------------------------
  ci-success:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build, db-migrations, terraform]
    steps:
      - name: Fail if any required check failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more required checks did not succeed."
          exit 1
      - name: All required checks passed
        run: echo "All required checks passed."
